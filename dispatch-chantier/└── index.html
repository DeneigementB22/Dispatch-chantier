<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dispatch Chantier</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
      margin: 0;
      padding: 20px;
    }

    h1, h2 {
      margin-top: 0;
    }

    .hidden {
      display: none;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .primary {
      background: #22c55e;
      color: #000;
    }

    .neutral {
      background: #334155;
      color: #fff;
    }

    .danger {
      background: #ef4444;
      color: #fff;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
    }

    .small {
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

<!-- ===================== -->
<!-- ACCUEIL -->
<!-- ===================== -->
<div id="home">
  <h1>Dispatch Chantier</h1>
  <p class="small">Preview – Inscription utilisateurs</p>

  <button class="primary" onclick="show('admin')">Créer un compte ADMIN</button>
  <button class="neutral" onclick="show('employe')">Créer un compte EMPLOYÉ</button>
  <button class="danger" onclick="showUsers()">Voir la base de données</button>
</div>

<!-- ===================== -->
<!-- INSCRIPTION ADMIN -->
<!-- ===================== -->
<div id="admin" class="hidden">
  <h2>Inscription – Admin</h2>

  <div class="card">
    <input id="adminName" placeholder="Nom complet">
    <input id="adminPhone" placeholder="Téléphone">
    <button class="primary" onclick="register('admin')">Créer le compte Admin</button>
  </div>

  <button class="neutral" onclick="back()">Retour</button>
</div>

<!-- ===================== -->
<!-- INSCRIPTION EMPLOYÉ -->
<!-- ===================== -->
<div id="employe" class="hidden">
  <h2>Inscription – Employé</h2>

  <div class="card">
    <input id="empName" placeholder="Nom complet">
    <input id="empPhone" placeholder="Téléphone">
    <button class="primary" onclick="register('employe')">Créer le compte Employé</button>
  </div>

  <button class="neutral" onclick="back()">Retour</button>
</div>

<!-- ===================== -->
<!-- BASE DE DONNÉES -->
<!-- ===================== -->
<div id="database" class="hidden">
  <h2>Utilisateurs enregistrés</h2>

  <div id="list"></div>

  <button class="neutral" onclick="back()">Retour</button>
</div>

<!-- ===================== -->
<!-- JAVASCRIPT -->
<!-- ===================== -->
<script>
  function show(id) {
    document.getElementById('home').classList.add('hidden');
    document.getElementById('admin').classList.add('hidden');
    document.getElementById('employe').classList.add('hidden');
    document.getElementById('database').classList.add('hidden');

    document.getElementById(id).classList.remove('hidden');
  }

  function back() {
    show('home');
  }

  function register(role) {
    let name, phone;

    if (role === 'admin') {
      name = document.getElementById('adminName').value;
      phone = document.getElementById('adminPhone').value;
    } else {
      name = document.getElementById('empName').value;
      phone = document.getElementById('empPhone').value;
    }

    if (!name || !phone) {
      alert('Veuillez remplir tous les champs');
      return;
    }

    const users = JSON.parse(localStorage.getItem('dispatch_users')) || [];

    users.push({
      id: Date.now(),
      name: name,
      phone: phone,
      role: role
    });

    localStorage.setItem('dispatch_users', JSON.stringify(users));

    alert('Compte créé avec succès');
    back();
  }

  function showUsers() {
    show('database');

    const list = document.getElementById('list');
    list.innerHTML = '';

    const users = JSON.parse(localStorage.getItem('dispatch_users')) || [];

    if (users.length === 0) {
      list.innerHTML = '<p class="small">Aucun utilisateur enregistré</p>';
      return;
    }

    users.forEach(u => {
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <strong>${u.name}</strong><br>
        📞 ${u.phone}<br>
        👤 Rôle : ${u.role.toUpperCase()}
      `;
      list.appendChild(div);
    });
  }
</script>

</body>
</html>
