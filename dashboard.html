<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | B22</title>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.card{
    background:#111827;
    padding:20px;
    border-radius:12px;
    margin-bottom:25px;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
}

h1{
    text-align:center;
    color:#22c55e;
}

h2{
    margin-top:0;
    color:#22c55e;
}

input, select{
    width:100%;
    padding:10px;
    margin:8px 0 12px 0;
    border:none;
    border-radius:6px;
    background:#1f2937;
    color:white;
}

button{
    padding:10px 15px;
    background:#22c55e;
    border:none;
    border-radius:6px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:10px;
}

button.danger{
    background:#dc2626;
}

ul{
    list-style:none;
    padding:0;
}

li{
    padding:8px;
    background:#1f2937;
    margin-bottom:6px;
    border-radius:6px;
}
</style>
</head>

<body>

<div class="container">

<h1>B22 Dashboard</h1>

<!-- SECTION EMPLOYÉS -->
<div class="card">
<h2>Employés</h2>

<input type="text" id="employeeName" placeholder="Nom employé">
<button onclick="addEmployee()">Ajouter employé</button>

<ul id="employeeList"></ul>
</div>

<!-- SECTION GROUPES -->
<div class="card">
<h2>Groupes / Chantiers</h2>

<input type="text" id="groupName" placeholder="Nom du groupe / chantier">
<button onclick="addGroup()">Créer groupe</button>

<ul id="groupList"></ul>
</div>

<!-- SECTION DISPATCH -->
<div class="card">
<h2>Dispatch</h2>

<select id="dispatchEmployee"></select>
<select id="dispatchGroup"></select>

<button onclick="dispatchEmployee()">Assigner</button>

<ul id="dispatchList"></ul>
</div>

<button onclick="logout()">Déconnexion</button>

</div>

<script>
let employees = JSON.parse(localStorage.getItem("employees")) || [];
let groups = JSON.parse(localStorage.getItem("groups")) || [];
let dispatches = JSON.parse(localStorage.getItem("dispatches")) || [];

function saveData(){
    localStorage.setItem("employees", JSON.stringify(employees));
    localStorage.setItem("groups", JSON.stringify(groups));
    localStorage.setItem("dispatches", JSON.stringify(dispatches));
}

function render(){
    // EMPLOYÉS
    let empList = document.getElementById("employeeList");
    empList.innerHTML = "";
    employees.forEach((emp,index)=>{
        empList.innerHTML += `<li>${emp} 
        <button class="danger" onclick="removeEmployee(${index})">X</button>
        </li>`;
    });

    // GROUPES
    let grpList = document.getElementById("groupList");
    grpList.innerHTML = "";
    groups.forEach((grp,index)=>{
        grpList.innerHTML += `<li>${grp}</li>`;
    });

    // SELECTS
    let empSelect = document.getElementById("dispatchEmployee");
    let grpSelect = document.getElementById("dispatchGroup");

    empSelect.innerHTML = "";
    grpSelect.innerHTML = "";

    employees.forEach(emp=>{
        empSelect.innerHTML += `<option>${emp}</option>`;
    });

    groups.forEach(grp=>{
        grpSelect.innerHTML += `<option>${grp}</option>`;
    });

    // DISPATCH LIST
    let disList = document.getElementById("dispatchList");
    disList.innerHTML = "";
    dispatches.forEach(d=>{
        disList.innerHTML += `<li>${d.employee} → ${d.group}</li>`;
    });
}

function addEmployee(){
    let name = document.getElementById("employeeName").value;
    if(name){
        employees.push(name);
        document.getElementById("employeeName").value="";
        saveData();
        render();
    }
}

function removeEmployee(index){
    employees.splice(index,1);
    saveData();
    render();
}

function addGroup(){
    let name = document.getElementById("groupName").value;
    if(name){
        groups.push(name);
        document.getElementById("groupName").value="";
        saveData();
        render();
    }
}

function dispatchEmployee(){
    let emp = document.getElementById("dispatchEmployee").value;
    let grp = document.getElementById("dispatchGroup").value;

    if(emp && grp){
        dispatches.push({employee:emp, group:grp});
        saveData();
        render();
    }
}

function logout(){
    window.location.href="login.html";
}

render();
</script>

</body>
</html>
