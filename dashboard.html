<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | B22</title>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#0f172a,#1e293b);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#111827;
    padding:35px;
    width:100%;
    max-width:420px;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

h1{
    text-align:center;
    color:#22c55e;
    margin-bottom:5px;
}

h2{
    text-align:center;
    color:#e5e7eb;
    margin-bottom:25px;
    font-weight:normal;
}

button{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    background:#22c55e;
    border:none;
    border-radius:8px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#16a34a;
}

.secondary{
    background:#374151;
}

.secondary:hover{
    background:#4b5563;
}
</style>
</head>

<body>

<div class="box">

<h1>B22</h1>
<h2>Dashboard</h2>

<button onclick="ajouterEmploye()">Ajouter employé</button>
<button onclick="supprimerEmploye()">Supprimer employé</button>

<button class="secondary" onclick="window.location.href='login.html'">
Déconnexion
</button>

</div>

<script>
function ajouterEmploye(){
    let nom = prompt("Nom de l'employé à ajouter :");
    if(nom){
        alert("Employé " + nom + " ajouté !");
    }
}

function supprimerEmploye(){
    let nom = prompt("Nom de l'employé à supprimer :");
    if(nom){
        alert("Employé " + nom + " supprimé !");
    }
}
</script>

</body>
</html>
