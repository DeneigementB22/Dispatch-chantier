<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion | Dispatch Chantier</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="page">

  <div class="card">
    <div class="brand">Dispatch Chantier</div>
    <div class="subtitle">Plateforme de coordination</div>

    <div class="form">

      <label>Courriel</label>
      <input type="email" id="loginEmail" placeholder="nom@entreprise.com">

      <label>Mot de passe</label>
      <input type="password" id="loginPassword" placeholder="••••••••">

      <button onclick="handleLogin()">Connexion</button>

      <p id="loginMsg" class="error"></p>

      <div class="footer">
        <span>Pas encore de compte ?</span>
        <a href="index.html">Créer un accès</a>
      </div>

    </div>
  </div>

</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
</body>
</html>
