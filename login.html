<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion - Dispatch Chantier</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="container login-container">
  <div class="logo">
    <h1>🏗️ Dispatch Chantier</h1>
  </div>
  <h2>Connexion</h2>
  <p class="subtitle">Accédez à votre compte</p>

  <div class="login-form">
    <input id="loginEmail" type="email" placeholder="Courriel">
    <input id="loginPassword" type="password" placeholder="Mot de passe">

    <button onclick="handleLogin()">Se connecter</button>

    <p id="loginMsg" class="msg"></p>

    <p class="small-text">Pas encore de compte ? <a href="index.html">Créer un compte</a></p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
</body>
</html>
