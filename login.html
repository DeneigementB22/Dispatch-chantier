<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion | B22</title>

<link rel="stylesheet" href="css/style.css">

<style>
/* Sécurité visuelle si le CSS externe ne charge pas */
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#0f172a,#1e293b);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-container{
    width:100%;
    display:flex;
    justify-content:center;
    padding:20px;
}

.login-box{
    background:#111827;
    padding:35px;
    width:100%;
    max-width:420px;
    border-radius:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

h1{
    text-align:center;
    color:#22c55e;
    margin-bottom:5px;
}

h2{
    text-align:center;
    color:#e5e7eb;
    margin-bottom:25px;
    font-weight:normal;
}

label{
    color:#cbd5e1;
    font-size:14px;
}

input{
    width:100%;
    padding:12px;
    margin-top:6px;
    margin-bottom:18px;
    border:none;
    border-radius:8px;
    background:#1f2937;
    color:white;
    font-size:15px;
}

input:focus{
    outline:none;
    border:1px solid #22c55e;
}

button{
    width:100%;
    padding:14px;
    background:#22c55e;
    border:none;
    border-radius:8px;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#16a34a;
}

.footer-link{
    text-align:center;
    margin-top:20px;
}

.footer-link a{
    color:#22c55e;
    text-decoration:none;
    font-size:14px;
}

.footer-link a:hover{
    text-decoration:underline;
}
</style>

</head>

<body>

<div class="login-container">
    <div class="login-box">

        <h1>B22</h1>
        <h2>Connexion</h2>

        <form id="loginForm">

            <label>Courriel</label>
            <input type="email" required>

            <label>Mot de passe</label>
            <input type="password" required>

            <button type="submit">Se connecter</button>

        </form>

        <div class="footer-link">
            <a href="register.html">Créer un compte</a>
        </div>

    </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
    e.preventDefault();
    window.location.href = "dashboard.html";
});
</script>

</body>
</html>
